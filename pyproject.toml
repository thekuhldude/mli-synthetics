[project]
name = "mli-synthetics"
version = "0.1.0"
description = "Synthetic data generation pipeline for MLI lighting AI"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "loguru>=0.7",
    "httpx>=0.27",
    "librosa>=0.10",
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "typer>=0.9",
    "rich>=13.7",
    "pypdf>=4.0",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "ruff>=0.1",
    "mypy>=1.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mli_synthetics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
